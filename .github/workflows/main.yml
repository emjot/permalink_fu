name: Tests

on:
  push:
    branches: [globalize]
    paths-ignore:
      - '**.md'

  pull_request:
    branches: [globalize]
    paths-ignore:
      - '**.md'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.0.6
          bundler-cache: true
      - name: Run rubocop
        run: bundle exec rubocop

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - 3.0.6
          - 3.1.4
          - 3.2.11
          - 3.3.12
          - 3.4.10
          - 4.0.6
        appraisal:
          - rails-7.0
          - rails-7.1
          - rails-7.2
          - rails-8.0
          - rails-8.1
        exclude:
          - ruby: 3.0.6
            appraisal: rails-7.2
          - ruby: 3.0.6
            appraisal: rails-8.0
          - ruby: 3.0.6
            appraisal: rails-8.1
          - ruby: 3.1.4
            appraisal: rails-8.0
          - ruby: 3.1.4
            appraisal: rails-8.1
    steps:
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install appraisal
        run: bundle exec appraisal ${{ matrix.appraisal }} install
      - name: Run the tests with all ruby versions
        run: bundle exec appraisal ${{ matrix.appraisal }} rake test
