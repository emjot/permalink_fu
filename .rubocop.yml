inherit_from:
  - .rubocop_todo.yml

plugins:
  - rubocop-performance
  - rubocop-rake
  - rubocop-rspec

inherit_mode:
  merge:
    - Exclude

AllCops:
  Include:
    - 'Appraisals'
    - '**/*.gemspec'
    - '**/*.rake'
    - '**/*.gemfile'
    - '**/Gemfile'
    - '**/Rakefile'
    - '**/Capfile'
    - '**/*.rb'
  Exclude:
    - 'gemfiles/**/*.gemfile'
  NewCops: enable
  TargetRubyVersion: 3.0
